<!doctype html>
<html lang="ja"><head><base target="_top"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--blue:#2463a5;--pale:#eef6ff;--line:#d6deea;--warn:#fff1c9;--same:#ffdce1}
  *{box-sizing:border-box} body{margin:0;background:#f6f8fb;color:#1d2939;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}
  header{padding:18px 20px;background:var(--blue);color:#fff} header h1{font-size:20px;margin:0}.wrap{max-width:1100px;margin:auto;padding:16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 14px;box-shadow:0 1px 2px #00000008}h2{font-size:16px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(90px,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:5px;font-size:13px}input,select,textarea,button{font:inherit}input,select,textarea{padding:9px;border:1px solid var(--line);border-radius:7px}textarea{width:100%;min-height:130px}button{padding:10px 14px;border:0;border-radius:8px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}button.sub{background:#e9eff7;color:#25384f}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.note{font-size:12px;color:#667085;margin:8px 0 0}.pair-row{display:flex;gap:7px;align-items:center;margin:7px 0}.pair-row select{flex:1}.pair-row button{background:#fff0f1;color:#9d2734;padding:8px}.pair-add{display:flex;gap:7px;margin-top:8px}.pair-add select{flex:1}.hidden{display:none}.result{overflow:auto}.seat-grid{display:grid;gap:7px;min-width:500px;margin-top:10px}.seat{min-height:64px;border:1px solid #bac8d8;border-radius:9px;padding:8px;background:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-size:14px;font-weight:700;cursor:pointer}.seat:hover{background:#e9f3ff}.seat.front{border-top:5px solid #48a274}.seat.same{background:var(--same);border-color:#e67985}.seat.selected{outline:3px solid #2463a5;outline-offset:2px;background:#dcecff}.legend{font-size:12px;margin-top:8px}.same-label{display:inline-block;background:var(--same);padding:3px 7px;border-radius:4px}.status{font-size:13px;font-weight:700;color:#286243}.warn{color:#a36100}@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}.seat-grid{min-width:420px}.seat{min-height:52px;font-size:12px}}
</style></head><body>
<header><h1>席替えアプリ</h1></header><main class="wrap">
<section class="card"><h2>1. 席と名簿</h2><div class="grid"><label class="field">縦（列の数）<input id="rows" type="number" min="1" max="20"></label><label class="field">横（列の数）<input id="cols" type="number" min="1" max="20"></label><label class="field">前席として扱う列数<input id="frontRows" type="number" min="1" max="20"></label></div><p class="note">教室の前を上として表示します。名簿は1行に1人ずつ入力してください。</p><textarea id="students" placeholder="例&#10;山田 太郎&#10;佐藤 花子"></textarea><div class="actions"><button onclick="saveBase()">名簿・席数を保存</button></div></section>
<section class="card"><h2>2. 条件</h2><p class="note">「前席希望」は名簿の名前の先頭に <b>★</b> を付けてください。例：★山田 太郎（作成時に前席を優先します）</p><div class="grid"><div><b>くっつける</b><div id="togetherList"></div><div class="pair-add"><select id="togetherA"></select><select id="togetherB"></select><button class="sub" onclick="addPair('together')">追加</button></div></div><div><b>離す</b><div id="apartList"></div><div class="pair-add"><select id="apartA"></select><select id="apartB"></select><button class="sub" onclick="addPair('apart')">追加</button></div></div></div><div class="actions"><button onclick="saveBase()">条件を保存</button></div></section>
<section class="card"><h2>3. 前回の座席</h2><p class="note">前回の座席表を作成後に「今回の結果を前回として保存」を押すと、次回は同じ席をピンクで表示します。</p><div id="previousPreview"></div></section>
<section class="card"><h2>4. 席替え案を作成</h2><div class="actions"><button onclick="generate()">席替え案を3案つくる</button><button class="sub" onclick="clearPrevious()">前回の座席を消去</button></div><p id="status" class="note"></p><div id="results"></div></section>
</main><script>
let data, latest=[], holding=[], selectedSeat=null;
function el(id){return document.getElementById(id)}
function normalName(n){return n.replace(/^★\s*/, '').trim()}
function init(){ google.script.run.withSuccessHandler(d=>{data=d; render();}).getAppData(); }
function render(){ el('rows').value=data.config.rows;el('cols').value=data.config.cols;el('frontRows').value=data.config.frontRows;el('students').value=data.students.map(n=>(n.front?'★':'')+n.name).join('\n'); renderPairs(); renderPrevious(); }
function names(){return (data.students||[]).map(s=>s.name)}
function selectOptions(){return '<option value="">選ぶ</option>'+names().map(n=>`<option>${escapeHtml(n)}</option>`).join('')}
function renderPairs(){ ['together','apart'].forEach(type=>{el(type+'A').innerHTML=selectOptions();el(type+'B').innerHTML=selectOptions();el(type+'List').innerHTML=(data.pairs[type]||[]).map((p,i)=>`<div class="pair-row"><span>${escapeHtml(p[0])}　↔　${escapeHtml(p[1])}</span><button onclick="removePair('${type}',${i})">×</button></div>`).join('')||'<p class="note">未登録</p>';}); }
function addPair(type){const a=el(type+'A').value,b=el(type+'B').value;if(!a||!b||a===b)return alert('異なる2人を選んでください。');if(data.pairs[type].some(p=>p.includes(a)&&p.includes(b)))return;data.pairs[type].push([a,b]);renderPairs();}
function removePair(type,i){data.pairs[type].splice(i,1);renderPairs();}
function readForm(){const roster=el('students').value.split('\n').map(x=>x.trim()).filter(Boolean).map(x=>({name:normalName(x),front:/^★/.test(x)})); const nameSet=new Set(roster.map(s=>s.name)); data.pairs.together=data.pairs.together.filter(p=>p.every(n=>nameSet.has(n)));data.pairs.apart=data.pairs.apart.filter(p=>p.every(n=>nameSet.has(n)));return {config:{rows:+el('rows').value,cols:+el('cols').value,frontRows:+el('frontRows').value},students:roster,pairs:data.pairs,previous:data.previous||[]};}
function saveBase(){try{data=readForm();google.script.run.withSuccessHandler(d=>{data=d;render();show('保存しました。');}).withFailureHandler(f=>alert(f.message)).saveAppData(data)}catch(e){alert(e.message)}}
function generate(){saveSilent(()=>{show('席替え案を作成中です…');google.script.run.withSuccessHandler(r=>{latest=r;holding=r.map(()=>[]);selectedSeat=null;renderResults();show('3案を作成しました。');}).withFailureHandler(f=>show(f.message,true)).generateSeating(data,3);});}
function saveSilent(next){try{data=readForm();google.script.run.withSuccessHandler(d=>{data=d;next();}).withFailureHandler(f=>alert(f.message)).saveAppData(data)}catch(e){alert(e.message)}}
function renderResults(){const {cols}=data.config;const previous=data.previous||[];el('results').innerHTML=latest.map((r,i)=>{const seats=r.layout.map((name,index)=>`<div class="seat ${index<cols*data.config.frontRows?'front':''} ${name&&previous[index]===name?'same':''} ${selectedSeat&&!selectedSeat.holding&&selectedSeat.plan===i&&selectedSeat.index===index?'selected':''}" onclick="selectSeat(${i},${index})">${escapeHtml(name||'空席')}</div>`).join('');const people=(holding[i]||[]).map((name,index)=>`<button class="sub" onclick="selectHolding(${i},${index})">${escapeHtml(name)}</button>`).join('')||'<span class="note">外に出している児童はいません。</span>';const action=selectedSeat&&!selectedSeat.holding&&selectedSeat.plan===i&&r.layout[selectedSeat.index]?`<button class="sub" onclick="moveToHolding(${i})">選択した児童を一時退避へ</button>`:'';const judgement=r.violations?'条件の一部が満たせていません':'すべての組合せ条件を満たしています';return `<div class="result card"><b>案${i+1}</b> <span class="status ${r.violations?'warn':''}">${judgement}</span><div class="seat-grid" style="grid-template-columns:repeat(${cols},1fr)">${seats}</div><p><b>一時退避：</b>${people}</p>${action}<p class="legend">席を2つ順にタップすると入れ替えます。外に出すときは席を選択して「一時退避へ」。戻すときは一時退避の名前→空席の順にタップします。</p><button onclick="useResult(${i})">この案を前回の座席として保存</button></div>`}).join('');}
function selectSeat(plan,index){if(selectedSeat&&selectedSeat.holding){if(selectedSeat.plan!==plan){selectedSeat={plan,index};renderResults();show('同じ案の空席を選んでください。');return}if(latest[plan].layout[index]){show('一時退避の児童は、空いている席にのみ戻せます。');return}latest[plan].layout[index]=holding[plan][selectedSeat.index];holding[plan].splice(selectedSeat.index,1);selectedSeat=null;renderResults();show('一時退避から空席へ戻しました。');return}if(!selectedSeat){selectedSeat={plan,index};renderResults();show('入れ替える相手をタップするか、「一時退避へ」を押してください。');return}if(selectedSeat.plan!==plan){selectedSeat={plan,index};renderResults();show('同じ案の中から、入れ替える相手を選んでください。');return}if(selectedSeat.index===index){selectedSeat=null;renderResults();show('選択を解除しました。');return}const from=selectedSeat.index;[latest[plan].layout[from],latest[plan].layout[index]]=[latest[plan].layout[index],latest[plan].layout[from]];selectedSeat=null;renderResults();show('席を入れ替えました。必要なら続けて調整できます。');}
function moveToHolding(plan){if(!selectedSeat||selectedSeat.plan!==plan||selectedSeat.holding)return;const name=latest[plan].layout[selectedSeat.index];if(!name)return;holding[plan].push(name);latest[plan].layout[selectedSeat.index]='';selectedSeat=null;renderResults();show(name+'さんを一時退避へ移動しました。');}
function selectHolding(plan,index){selectedSeat={plan,index,holding:true};renderResults();show('空いている席をタップすると、この児童を戻せます。');}
function useResult(i){if((holding[i]||[]).length){alert('一時退避にいる児童を全員、空席へ戻してから保存してください。');return}data.previous=latest[i].layout;saveBase();renderResults();show('この案を次回比較用の「前回の座席」として保存しました。');}
function renderPrevious(){const c=data.config.cols, p=data.previous||[];if(!p.some(Boolean)){el('previousPreview').innerHTML='<p class="note">まだ保存されていません。</p>';return}el('previousPreview').innerHTML=`<div class="result"><div class="seat-grid" style="grid-template-columns:repeat(${c},1fr)">${p.map(n=>`<div class="seat">${escapeHtml(n||'空席')}</div>`).join('')}</div></div>`}
function clearPrevious(){if(!confirm('前回の座席を消去しますか？'))return;data.previous=[];saveBase();}
function show(s,err){el('status').textContent=s;el('status').className='note '+(err?'warn':'')}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
init();
</script></body></html>
